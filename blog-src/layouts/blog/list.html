{{ define "main" }}
    <div class="page-head">
      <h1 class="page-title">{{ .Title }}</h1>
      <p class="lede">{{ .Description }}</p>
    </div>

    <ul class="post-list">
      {{- range .Pages.ByDate.Reverse }}
      <li class="post-summary">
        <a class="post-summary-title" href="{{ .RelPermalink }}">{{ .Title }}</a>
        <p class="post-meta">
          <time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Date.Format "2006-01-02" }}</time>
          {{- range .Params.categories }}
          <a href="{{ printf "/blog/categories/%s/" . | relURL }}">{{ . }}</a>
          {{- end }}
        </p>
        <p class="post-summary-description">{{ .Description }}</p>
      </li>
      {{- end }}
    </ul>
{{ end }}
