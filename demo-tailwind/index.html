    <script>
      (function (location, history) {
        if (location.search[1] !== '/') {
          return;
        }
        var decoded = location.search
          .slice(1)
          .split('&')
          .map(function (part) {
            return part.replace(/~and~/g, '&');
          })
          .join('?');
        history.replaceState(
          null,
          '',
          location.pathname.slice(0, -1) + decoded + location.hash,
        );
      })(window.location, window.history);
    </script>
